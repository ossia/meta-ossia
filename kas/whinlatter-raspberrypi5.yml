header:
  version: 14
  includes:
    - whinlatter-qemux86-64.yml

# Same Yocto 5.3 stack, targeting a Pi 5 / CM5. Produces a .wic.bz2 that
# bmaptool or dd writes straight to an SD card or NVMe.
machine: raspberrypi5

repos:
  meta-raspberrypi:
    url: https://github.com/agherzan/meta-raspberrypi
    refspec: whinlatter

local_conf_header:
  raspberrypi5: |
    # v3d/vc4 gallium and, through DISTRO_FEATURES vulkan, v3dv come from
    # meta-raspberrypi's mesa bbappend.
    # The machine recommends licence-gated WiFi firmware; without this the
    # image does not parse. See meta-raspberrypi/docs/ipcompliance.md.
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"

    RASPBERRYPI_CAMERA_V2 = "0"
    ENABLE_UART = "1"
    DISABLE_OVERSCAN = "1"

    # No GPU_MEM: VideoCore IV/VI only, inert on the Pi 5.

    IMAGE_FSTYPES:forcevariable = "wic.bz2 wic.bmap"
