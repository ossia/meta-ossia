header:
  version: 14
  includes:
    - whinlatter-qemux86-64.yml

# Orange Pi 5 Plus (Rockchip RK3588, Mali-G610). Produces a .wic that goes to
# eMMC, NVMe or an SD card.
machine: orangepi-5-plus

repos:
  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    refspec: whinlatter
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-rockchip:
    url: https://git.yoctoproject.org/meta-rockchip
    refspec: whinlatter
    # The rkbin recipes -- the DDR init blob, TF-A and OP-TEE, i.e. everything
    # the board needs to reach U-Boot -- still set S = "${WORKDIR}/git", which
    # oe-core now rejects outright in do_unpack because the git fetcher unpacks
    # there by default. Nothing in the bootloader chain builds without this.
    #
    # Both are upstream commits, applied unchanged, and both are on
    # meta-rockchip master; drop them whenever the refspec moves past them.
    # They are patches rather than bbappends on purpose: a bbappend for a recipe
    # no other board has would be a dangling append breaking every non-rockchip
    # build in this layer.
    patches:
      rkbin-s:
        repo: meta-ossia
        path: patches/meta-rockchip/0001-rkbin-s.patch
      rkbin-native-s:
        repo: meta-ossia
        path: patches/meta-rockchip/0002-rkbin-native-s.patch

local_conf_header:
  rk3588: |
    # meta-rockchip derives the boot console from SERIAL_CONSOLES, which the
    # ossia distro deliberately empties to keep a getty off the serial port.
    # Empty makes RK_CONSOLE_DEVICE's ${SERIAL_CONSOLES.split(';')[1]} index off
    # the end, and every recipe parse dies on the expansion. Set both directly:
    # they configure U-Boot's extlinux cmdline and TF-A's UART, which is the
    # boot console and has nothing to do with whether a login prompt runs on it.
    # ttyS2 at 1500000 is the rk3588 debug UART, matching rockchip-defaults.inc.
    RK_CONSOLE_DEVICE = "ttyS2"
    RK_CONSOLE_BAUD = "1500000"

    # rk3588s.inc asks for KERNEL_CLASSES = "kernel-fitimage", a class oe-core
    # deleted when it rewrote FIT support as kernel-fit-image.bbclass. The
    # rework reached meta-rockchip master and wrynose but never the whinlatter
    # branch, so on whinlatter oe-core every rk3588 machine dies at parse with
    # "Could not inherit file classes/kernel-fitimage.bbclass".
    #
    # Boot a plain kernel instead of fixing FIT. rockchip-extlinux.inc supports
    # it directly: the extlinux config gains an explicit FDTDIR, and
    # kernel-devicetree is added to the image, so U-Boot loads /boot/Image and
    # the dtb separately. We get nothing from FIT here -- no signature
    # verification, no multi-dtb selection, one board, one device tree.
    #
    # forcevariable on KERNEL_CLASSES because rk3588s.inc sets it with a hard
    # '=' and machine config is parsed after local.conf. KERNEL_IMAGETYPE is
    # only ?= there, so a plain assignment already wins.
    KERNEL_IMAGETYPE = "Image"
    KERNEL_CLASSES:forcevariable = ""

    # rockchip-wic.inc leaves the .wic uncompressed; an XFCE rootfs is several
    # GB of mostly zeroes. bmaptool reads the compressed file directly.
    WIC_COMPRESSION_EXTENSION = ".bz2"

    # rockchip-defaults.inc's XSERVER still lists xf86-input-mouse, a recipe
    # oe-core has dropped, so any x11 build of this board fails to find a
    # provider. Same stale-branch story as the fitImage class above.
    #
    # This is the set the Pi 5 desktop image resolved to and shipped with.
    # No input driver is named because none needs to be: xf86-input-libinput
    # arrives through the x11 packagegroups, which is how it reached that image.
    # Inert on a non-x11 build, where nothing reads XSERVER at all.
    XSERVER:forcevariable = "xserver-xorg xserver-xorg-extension-glx xf86-video-modesetting"

    # meta-rockchip's mesa bbappend skips rk3588; without this the board runs
    # on llvmpipe. libclc is required: GALLIUMDRIVERS and VULKAN_DRIVERS are
    # gated on 'panfrost libclc' together and oe-core only adds libclc on x86.
    #
    # No kmsro here: mesa dropped it as a separate gallium driver once every
    # driver learned to handle a display-only KMS node itself, and naming it
    # fails do_recipe_qa with "invalid PACKAGECONFIG(s)".
    PACKAGECONFIG:append:pn-mesa = " panfrost libclc"

    # panthor will not probe without ARM's CSF firmware; G610 is arch 10.8.
    IMAGE_INSTALL:append = " linux-firmware-mali-csffw-arch108"

    # No hardware video decode: mainline rkvdec2 is a stateless V4L2 device
    # needing the request API, which upstream ffmpeg does not support.
    # Verify after first boot:
    #   ls /sys/class/drm/                 -> card0 + renderD128 present
    #   dmesg | grep -i panthor            -> firmware loaded, no probe error
    #   score's log must NOT say "Running on a software rasterizer"
