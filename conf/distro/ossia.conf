DISTRO = "ossia"
DISTRO_NAME = "ossia score appliance"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "whinlatter"
MAINTAINER = "ossia devs <contact@ossia.io>"

SDK_VENDOR = "-ossiasdk"
SDK_VERSION = "${@d.getVar('DISTRO_VERSION').replace('snapshot-${METADATA_REVISION}', 'snapshot')}"

# score and Qt are not tested against musl.
TCLIBC = "glibc"

INIT_MANAGER = "systemd"

# journald is the log. Must be distro-level: packagegroup-core-boot reads this
# while being parsed.
VIRTUAL-RUNTIME_base-utils-syslog = ""

# printk to a UART is synchronous and costs seconds of boot over a few hundred
# messages. OSSIA_VERBOSE_BOOT = "1" in local.conf puts them back.
OSSIA_VERBOSE_BOOT ?= "0"
OSSIA_QUIET_CMDLINE = "${@' quiet loglevel=3 systemd.show_status=0' if d.getVar('OSSIA_VERBOSE_BOOT') != '1' else ''}"
APPEND:append = "${OSSIA_QUIET_CMDLINE}"
# meta-raspberrypi builds cmdline.txt from CMDLINE and never reads APPEND.
CMDLINE:append = "${OSSIA_QUIET_CMDLINE}"
# No getty: the panel stays dark until score draws. Access is over ssh.
SERIAL_CONSOLES = "${@'115200;ttyS0 115200;ttyS1' if d.getVar('OSSIA_VERBOSE_BOOT') == '1' else ''}"

DISTRO_FEATURES = " \
    acl \
    alsa \
    argp \
    bluetooth \
    ipv4 \
    ipv6 \
    largefile \
    opengl \
    pam \
    seccomp \
    systemd \
    usbhost \
    vulkan \
    wayland \
    xattr \
    zeroconf \
"

# No x11: score renders through eglfs/vkkhrdisplay on DRM/KMS, or wayland.
# oe-core gates libx11 behind the feature, so score builds with no X11 headers;
# its X11-dependent parts are all __has_include- or X11_FOUND-guarded.
# Add "x11" above for the xcb platform plugin and X11 window capture.

PREFERRED_PROVIDER_virtual/libgl ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles1 ?= "mesa"
PREFERRED_PROVIDER_virtual/libgles2 ?= "mesa"
PREFERRED_PROVIDER_virtual/egl ?= "mesa"

# ffmpeg is LGPL/GPL but carries LICENSE_FLAGS = "commercial" in oe-core.
LICENSE_FLAGS_ACCEPTED += "commercial_ffmpeg"

# security_flags.inc is deliberately not required: -fstack-protector-strong and
# -D_FORTIFY_SOURCE=2 on a realtime engine. Add it back if the box is exposed.
require conf/distro/include/yocto-uninative.inc
INHERIT += "uninative"
